<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Upscale to 4K</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">&#9679;</span>
        <div>
          <h1>Upscale to 4K</h1>
          <p>Upload any image and get a crisp 4K upscale.</p>
        </div>
      </div>
      <div class="budget" id="budget-pill" title="daily budget">
        <span class="dot"></span>
        <span id="budget-text">Loading budget…</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel controls">
        <div class="field-group">
          <h2>Your image</h2>
          <p class="hint">Upload any photo or image you'd like upscaled to 4K.</p>
          <div class="photo-slots single" id="photo-slots">
            <label class="photo-slot" data-index="0">
              <input type="file" accept="image/*" class="photo-input" />
              <span class="plus">+</span>
              <span class="slot-label">Image to upscale</span>
            </label>
          </div>
        </div>

        <button id="pay-btn" class="generate-btn" disabled>
          <span id="pay-btn-text">Pay $3.00 to Upscale to 4K</span>
        </button>
        <p class="hint" id="price-hint"></p>
        <p class="error-text" id="error-text"></p>
      </section>

      <section class="panel preview">
        <div class="row-between">
          <h2>Preview</h2>
          <span class="hint" id="preview-hint">Upscale runs after payment &mdash; takes approx 20-60 secs</span>
          <button id="download-btn" class="download-btn hidden" type="button">&#8681; Download 4K</button>
        </div>
        <div class="preview-frame" id="preview-frame">
          <div class="preview-placeholder" id="preview-placeholder">
            <span class="preview-icon">&#128301;</span>
            <p>Your image will appear here</p>
          </div>
          <img id="preview-image" class="preview-image hidden" alt="Uploaded image" />
          <div class="preview-loading hidden" id="preview-loading">
            <div class="spinner"></div>
            <p>Upscaling to 4K…</p>
          </div>
        </div>
      </section>
    </main>

    <section class="gallery-section">
      <div class="row-between">
        <h2>Your uploads</h2>
      </div>
      <div class="gallery" id="gallery"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
